[project]
name = "waynon"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.10, <3.11"
authors =[
    { name="Jad Abou-Chakra", email = "jchakra@theaiinstitute.com"}
]

dependencies = [
    "numpy", 
    "scipy", 
    "torch", 
    "trio", 
    "tyro",
    "esper",
    "opencv-python",
    "pydantic",
    "anytree",
    "pillow",
    "symforce",
    "trio-websocket@git+https://github.com/jc211/trio-websocket",
    "marsoom @ git+https://github.com/jc211/marsoom#b94f9d87303a6a49daafa50b434b6bf855f038e8",
    "panda-python@git+https://github.com/jc211/panda-py#b1f923c9fbce3c82aaffb13d2e3b1efd9b6403be",
    "panda_desk@git+https://github.com/jc211/panda_desk.git#9c2271ee4d2f707fb4e2151d3ccdabbcb045a446",
    "realsense@git+https://github.com/davelearn/realsense.git#e2632dd0fdcbe7a1fb3161d9c9a5b3be81468f20", 
    "matplotlib>=3.10.1,<4",
    ]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pixi.project]
channels = ["jc211", "davelearn", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
waynon = { path = ".", editable = true }

[tool.pixi.tasks]
start = { cmd = "python src/waynon/main.py" }

[tool.pixi.dependencies]
eigen = "*"
libfranka = { version = "=0.9.2", channel = "davelearn" }
pinocchio = "*"
pyrealsense2 = "*"
pip = ">=25.1.1,<26"
ruckig = {version = "*", channel="jc211"}
cmake = ">3.26.1,<4.0.0"
